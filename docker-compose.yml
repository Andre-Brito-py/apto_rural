services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: apto
      POSTGRES_PASSWORD: apto
      POSTGRES_DB: apto_rural
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
